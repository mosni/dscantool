# dscan.mosni.dev → Django app (gunicorn, whitenoise for static)
# dscan.nimos.ws is the ONE nimos.ws name kept: it 301s to dscan.mosni.dev (both covered by one cert
# lineage, dscan.mosni.dev). The serving block is FIRST so lib/deploy's ensure_cert() names the lineage
# after dscan.mosni.dev and issues both SANs in one go.
# TLS is committed here (not injected by `certbot --nginx`): lib/deploy keeps a committed 443 block
# as-is, so `git reset --hard` on redeploy can never drop it. certbot only RENEWS the cert files.
server {
    server_name dscan.mosni.dev;
    location / {
        proxy_pass http://127.0.0.1:33017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dscan.mosni.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dscan.mosni.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Legacy dscan.nimos.ws → permanent redirect to dscan.mosni.dev.
server {
    server_name dscan.nimos.ws;
    location / { return 301 https://dscan.mosni.dev$request_uri; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dscan.mosni.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dscan.mosni.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# dscan.mosni.dev — HTTP → HTTPS
server {
    server_name dscan.mosni.dev;
    listen 80;
    return 301 https://$host$request_uri;
}

# dscan.nimos.ws — HTTP → HTTPS
server {
    server_name dscan.nimos.ws;
    listen 80;
    return 301 https://$host$request_uri;
}
